<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CXBot 人工控制台</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #171b23;
    --panel-2: #1f2430;
    --line: #2a3040;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #4c8dff;
    --accent-2: #2f6fe0;
    --in: #232a36;
    --out: #2b4d86;
    --warn: #f0a33c;
    --danger: #e05b5b;
    --ok: #4cc38a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    overflow: hidden;
  }
  #sidebar {
    width: 320px;
    flex: 0 0 320px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  #sessions {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .session {
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 6px;
  }
  .session:hover { background: var(--panel-2); }
  .session.active { background: var(--panel-2); border-color: var(--accent); }
  .session .row { display: flex; align-items: center; gap: 8px; }
  .session .key {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .session .preview {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session .meta { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 20px;
    background: var(--line);
    color: var(--muted);
  }
  .tag.held { background: rgba(240, 163, 60, .18); color: var(--warn); }
  .tag.unread { background: var(--accent); color: #fff; }
  .time { font-size: 11px; color: var(--muted); margin-left: auto; }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  #chatHeader {
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
  }
  #chatTitle { font-weight: 600; font-size: 15px; }
  #chatState { color: var(--muted); font-size: 12px; }
  #holdBtn {
    margin-left: auto;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  #holdBtn:hover { border-color: var(--accent); }
  #holdBtn.on { border-color: var(--warn); color: var(--warn); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
  }
  .msg { display: flex; flex-direction: column; max-width: 72%; }
  .msg.in { align-self: flex-start; align-items: flex-start; }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 9px 12px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--in);
    font-size: 14px;
  }
  .msg.out .bubble { background: var(--out); }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .composer {
    border-top: 1px solid var(--line);
    padding: 12px;
    display: flex;
    gap: 10px;
    background: var(--panel);
  }
  .composer textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    outline: none;
  }
  .composer textarea:focus { border-color: var(--accent); }
  #sendBtn {
    align-self: flex-end;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 11px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  #mediaBtn {
    align-self: flex-end;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  #mediaBtn:disabled { opacity: .5; cursor: not-allowed; }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: #2a1f1f;
    color: #ffb4b4;
    border: 1px solid #5a2a2a;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    max-width: 80vw;
  }
  #toast.show { opacity: 1; }
  #conn {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); display: inline-block; margin-right: 6px;
  }
  #conn.on { background: var(--ok); }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; flex: 0 0 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .msg { max-width: 88%; }
  }
</style>
<style>
  /* 简洁浅色主题 */
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #f7f8fa;
    --line: #e5e7eb;
    --text: #1f2329;
    --muted: #8a919f;
    --accent: #2563eb;
    --accent-2: #1d4ed8;
    --in: #ffffff;
    --out: #2563eb;
  }
  body { background: var(--bg); color: var(--text); }
  #sidebar { background: #fff; width: 300px; flex-basis: 300px; }
  .brand { padding: 14px 14px 10px; }
  .brand h1 { font-size: 15px; }
  .session { padding: 9px 10px; border-radius: 8px; margin-bottom: 2px; }
  .session:hover { background: var(--panel-2); }
  .session.active { background: #eef4ff; border-color: #dbe7ff; }
  .session .key { font-size: 13px; }
  .session .preview { font-size: 12px; }
  .tag { border-radius: 4px; padding: 0 5px; background: #f2f3f5; }
  .tag.held { background: #fff4e5; color: #b26a00; }
  .tag.unread { background: var(--accent); color: #fff; }
  #chatHeader { background: #fff; padding: 10px 16px; }
  #holdBtn { background: #fff; border-radius: 6px; padding: 6px 12px; }
  #holdBtn.on { background: #fff7ea; border-color: #f0a33c; color: #b26a00; }
  #messages { background: var(--bg); padding: 16px; gap: 10px; }
  .bubble { border-radius: 8px; }
  .msg.in .bubble { background: #fff; border: 1px solid var(--line); }
  .msg.out .bubble { background: var(--accent); color: #fff; }
  .msg .who { color: var(--muted); }
  .composer { background: #fff; padding: 10px 12px; }
  .composer textarea { background: #fff; border-radius: 8px; }
  #sendBtn { border-radius: 8px; padding: 10px 18px; }
  #toast {
    background: #fff3f3; color: #b42318; border-color: #f5c2c0;
    box-shadow: 0 6px 24px rgba(15, 23, 42, .12);
  }
  .live { align-self: flex-end; align-items: flex-end; max-width: 72%; }
  .live .who { color: var(--muted); }
  .live .bubble {
    background: #eef4ff; border: 1px solid #dbe7ff; color: #1e3a8a;
    font-size: 13px;
  }
  .live .bubble::after {
    content: "▍"; margin-left: 2px; color: var(--accent);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #login {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(244, 245, 247, .97);
    display: none; align-items: center; justify-content: center;
  }
  #login.show { display: flex; }
  .login-card {
    width: min(360px, 90vw); background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 24px 22px; text-align: center;
    box-shadow: 0 10px 40px rgba(15, 23, 42, .08);
  }
  .login-card h2 { margin: 0 0 6px; font-size: 18px; }
  .login-card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .login-card input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 16px; letter-spacing: 4px;
    text-align: center; outline: none; margin-bottom: 12px;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card button {
    width: 100%; border: 0; background: var(--accent); color: #fff;
    padding: 11px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  #loginError { color: #b42318; font-size: 12px; min-height: 18px; margin-top: 8px; }
  #logoutBtn {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  #logoutBtn:hover { color: var(--text); }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">
    <h1>CXBot 人工控制台</h1>
    <p><span id="conn"></span>本机模式 · 接管后消息不再自动回复</p>
  </div>
  <div id="sessions"></div>
</aside>

<main id="main">
  <div id="chatHeader">
    <div>
      <div id="chatTitle">选择左侧会话</div>
      <div id="chatState">默认由 AI 自动回复</div>
    </div>
    <button id="holdBtn" disabled>人工接管</button>
    <button id="logoutBtn">退出</button>
  </div>
  <div id="messages"><div class="empty">暂无消息</div></div>
  <div class="composer">
    <textarea id="input" placeholder="输入要发送的内容，Enter 发送，Shift+Enter 换行" disabled></textarea>
    <button id="mediaBtn" disabled>图片/文件</button>
    <input id="fileInput" type="file" hidden>
    <button id="sendBtn" disabled>发送</button>
  </div>
</main>

<div id="login">
  <div class="login-card">
    <h2>CXBot 人工控制台</h2>
    <p>在 QQ 私聊发送 <b>/console</b> 获取验证码<br>验证码每 30 秒刷新</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码">
    <button id="loginBtn">登录</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="toast"></div>

<script>
let sessions = [];
let currentKey = null;
let currentHeld = false;
let currentLive = null;
let authed = false;
let uploadMb = 20;
let ws = null;

const $ = (id) => document.getElementById(id);

function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 3200);
}

async function api(path, options) {
  const resp = await fetch(path, options);
  let data = {};
  try { data = await resp.json(); } catch (e) {}
  if (resp.status === 401) {
    showLogin();
    throw new Error(data.error || '未登录');
  }
  if (!resp.ok) throw new Error(data.error || `请求失败（${resp.status}）`);
  return data;
}

function showLogin() {
  authed = false;
  $('login').classList.add('show');
  $('code').focus();
}

async function checkAuth() {
  try {
    const data = await api('/api/session');
    authed = !!data.authed;
    if (typeof data.upload_mb === 'number' && data.upload_mb > 0) {
      uploadMb = data.upload_mb;
    }
  } catch (e) {
    authed = false;
  }
  if (authed) {
    $('login').classList.remove('show');
    await loadSessions();
    connectWs();
  } else {
    showLogin();
  }
}

async function login() {
  const code = $('code').value.trim();
  if (!code) return;
  $('loginError').textContent = '';
  $('loginBtn').disabled = true;
  try {
    await api('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    authed = true;
    $('login').classList.remove('show');
    $('code').value = '';
    await checkAuth();
  } catch (e) {
    $('loginError').textContent = e.message;
  } finally {
    $('loginBtn').disabled = false;
  }
}

async function logout() {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
  if (ws) ws.close();
  showLogin();
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function renderSessions() {
  const box = $('sessions');
  box.textContent = '';
  if (!sessions.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '还没有收到消息';
    box.appendChild(empty);
    return;
  }
  for (const item of sessions) {
    const el = document.createElement('div');
    el.className = 'session' + (item.key === currentKey ? ' active' : '');
    el.onclick = () => openSession(item.key);

    const row = document.createElement('div');
    row.className = 'row';
    const key = document.createElement('div');
    key.className = 'key';
    key.textContent = item.key;
    row.appendChild(key);
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = fmtTime(item.updated_at);
    row.appendChild(time);

    const preview = document.createElement('div');
    preview.className = 'preview';
    if (item.live) {
      preview.textContent = '实时 · ' + (item.live.text || 'AI 正在处理…');
    } else {
      preview.textContent = item.preview || '（无文本）';
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const kind = document.createElement('span');
    kind.className = 'tag';
    kind.textContent = item.kind === 'group' ? '群聊' : '私聊';
    meta.appendChild(kind);
    if (item.held) {
      const held = document.createElement('span');
      held.className = 'tag held';
      held.textContent = '人工接管';
      meta.appendChild(held);
    }
    if (item.unread) {
      const unread = document.createElement('span');
      unread.className = 'tag unread';
      unread.textContent = `${item.unread} 未读`;
      meta.appendChild(unread);
    }

    el.appendChild(row);
    el.appendChild(preview);
    el.appendChild(meta);
    box.appendChild(el);
  }
}

async function loadSessions() {
  try {
    const data = await api('/api/sessions');
    sessions = data.sessions || [];
    const current = sessions.find((item) => item.key === currentKey);
    currentHeld = current ? !!current.held : false;
    renderSessions();
    updateHeader();
  } catch (e) {
    console.warn(e);
  }
}

function updateHeader() {
  const current = sessions.find((item) => item.key === currentKey);
  $('chatTitle').textContent = currentKey || '选择左侧会话';
  $('chatState').textContent = currentKey
    ? (currentHeld ? '人工接管中，AI 不会自动回复' : 'AI 自动回复中')
    : '默认由 AI 自动回复';
  const btn = $('holdBtn');
  btn.disabled = !currentKey;
  btn.textContent = currentHeld ? '恢复 AI 回复' : '人工接管';
  btn.classList.toggle('on', currentHeld);
  $('input').disabled = !currentKey;
  $('sendBtn').disabled = !currentKey;
  $('mediaBtn').disabled = !currentKey;
}

function renderMessages(messages) {
  const box = $('messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.textContent = '';
  if (!messages.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无消息';
    box.appendChild(empty);
    return;
  }
  for (const msg of messages) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (msg.dir === 'out' ? 'out' : 'in');
    const who = document.createElement('div');
    who.className = 'who';
    const sender = msg.sender === 'user' ? (msg.user || '用户')
      : msg.sender === 'operator' ? '人工' : 'AI';
    who.textContent = `${sender} · ${fmtTime(msg.ts)}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text || '';
    wrap.appendChild(who);
    wrap.appendChild(bubble);
    box.appendChild(wrap);
  }
  if (nearBottom) box.scrollTop = box.scrollHeight;
  renderLive();
}

function renderLive() {
  const box = $('messages');
  const old = document.getElementById('liveMsg');
  if (old) old.remove();
  if (!currentLive || !currentLive.text) return;
  const wrap = document.createElement('div');
  wrap.id = 'liveMsg';
  wrap.className = 'msg live';
  const who = document.createElement('div');
  who.className = 'who';
  const label = currentLive.kind === 'tool' ? '工具调用'
    : currentLive.kind === 'answer' ? '生成中' : '思考中';
  who.textContent = `AI · ${label}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = currentLive.text;
  wrap.appendChild(who);
  wrap.appendChild(bubble);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
}

async function loadMessages() {
  if (!currentKey) return;
  try {
    const data = await api('/api/messages?key=' + encodeURIComponent(currentKey));
    currentLive = data.live || null;
    renderMessages(data.messages || []);
  } catch (e) {
    toast(e.message);
  }
}

async function openSession(key) {
  currentKey = key;
  await loadSessions();
  await loadMessages();
  await loadSessions();
  $('input').focus();
}

async function sendMessage() {
  if (!currentKey) return;
  const input = $('input');
  const text = input.value.trim();
  if (!text) return;
  $('sendBtn').disabled = true;
  try {
    await api('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: currentKey, text }),
    });
    input.value = '';
    await loadMessages();
    await loadSessions();
  } catch (e) {
    toast(e.message);
  } finally {
    $('sendBtn').disabled = false;
  }
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || '');
      resolve(text.slice(text.indexOf(',') + 1));
    };
    reader.onerror = () => reject(new Error('读取文件失败'));
    reader.readAsDataURL(file);
  });
}

async function sendMedia(file) {
  if (!currentKey || !file) return;
  if (file.size > uploadMb * 1024 * 1024) {
    toast(`文件过大，控制台上限 ${uploadMb}MB`);
    return;
  }
  $('mediaBtn').disabled = true;
  try {
    const data = await readAsBase64(file);
    const caption = $('input').value.trim();
    await api('/api/send_media', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        key: currentKey,
        name: file.name,
        type: file.type || '',
        data,
        caption,
      }),
    });
    $('input').value = '';
    toast(`已发送${file.type.startsWith('image/') ? '图片' : '文件'}`);
    await loadMessages();
    await loadSessions();
  } catch (e) {
    toast(e.message);
  } finally {
    $('mediaBtn').disabled = !currentKey;
    $('fileInput').value = '';
  }
}

async function toggleHold() {
  if (!currentKey) return;
  try {
    await api('/api/takeover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: currentKey, held: !currentHeld }),
    });
    await loadSessions();
    toast(!currentHeld ? '已恢复 AI 自动回复' : '已开启人工接管');
  } catch (e) {
    toast(e.message);
  }
}

function connectWs() {
  if (!authed) return;
  if (ws && ws.readyState <= 1) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => $('conn').classList.add('on');
  ws.onclose = (event) => {
    $('conn').classList.remove('on');
    if (!authed || event.code === 4401) {
      showLogin();
      return;
    }
    setTimeout(connectWs, 3000);
  };
  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    if (data.type === 'live') {
      if (data.key === currentKey) {
        currentLive = data.live;
        renderLive();
      }
      loadSessions();
      return;
    }
    loadSessions();
    if (data.key && data.key === currentKey && data.type === 'message') {
      loadMessages();
    }
  };
}

$('holdBtn').onclick = toggleHold;
$('sendBtn').onclick = sendMessage;
$('mediaBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = () => sendMedia($('fileInput').files[0]);
$('loginBtn').onclick = login;
$('logoutBtn').onclick = logout;
$('code').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    login();
  }
});
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
